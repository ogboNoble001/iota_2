<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Centered 20x20 rounded background -->
  <rect x="6" y="6" width="20" height="20" rx="2" fill="#1c1a18" />
  
  <!-- Top row -->
  <rect x="9" y="9" width="5" height="5" rx="2" fill="white" opacity=".9" />
  <rect x="18" y="9" width="5" height="5" rx="2" fill="white" opacity=".6" />
  
  <!-- Bottom row -->
  <rect x="9" y="18" width="5" height="5" rx="2" fill="white" opacity=".6" />
  <rect x="18" y="18" width="5" height="5" rx="2" fill="white" opacity=".35" />
</svg>